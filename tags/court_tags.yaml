card_id: queen-of-cups
court_archetype:
  position: queen
  energy: Mastered emotional depth, intuitive wisdom flowing from within like a wellspring
  role: The healer, counselor, psychic — the ultimate emotionally intelligent nurturer
suit_domain:
  element: water
  theme: Emotion, intuition, relationships, love, the heart, healing
  zodiac_tendancy: Cancer, Scorpio, Pisces (water signs deep and feeling)
persona_tags:
  - Seems to know what's wrong before you even speak — uncanny intuition
  - Heals, nurtures, bakes cookies, provides emotional support that never runs dry
  - Creative storyteller and artist, spiritually connected to otherworldly realms
  - Shy and self-effacing at times, mysterious and otherworldly at others
  - Affectionate and loving, puts her heart into everything
  - Deeply emotional — her temper runs very deep and is terrifying when unleashed
  - Can suffer from mood swings, hormonal imbalances, depression, addiction
  - Uses emotional leverage and fragility as tools of manipulation when imbalanced
context_signals:
  development: Signifies developing a romance, developing psychic powers, or the growth of a family
  adult_interpretation: Often a healer, counselor, or psychic — a woman who has the right solution to every emotional or relational problem; she may be shy and self-effacing or scary and spiritually intense; she bakes and hugs and heals; her intuition is uncanny but she can be prone to mood disorders and manipulation
  shadow: Reversed, she uses love as leverage — making you feel guilty or ashamed, playing the fragile victim to extract compliance; emotions are blocked (feeling nothing) or turned upside-down (dark feelings); addiction, hormonal issues, bi-polar, post-partum depression; psychic abilities may go dark

