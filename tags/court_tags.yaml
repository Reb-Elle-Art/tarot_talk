  element: fire
  theme: Passion, creativity, ambition, action, and the spark of inspiration
  zodiac_tendancy: Aries, Leo, Sagittarius (fire signs — energy, courage, leadership, self-expression)
persona_tags:
  - Magnetic and larger-than-life; fills every room with energy and confidence
  - Born leader and innovator; turns companies, teams, and causes around
  - Charismatic enough to inspire genuine worship in followers
  - Romantic and devoted partner who fell in love at first sight and courts passionately
  - Inventive and playful parent who makes life an adventure
  - Demands total support from family; expects them to follow wherever he leads
  - Can become jealous, impatient, and tyrannical when crossed
  - Values recognition and approval over material wealth
context_signals:
  development: Growth toward mastery means tempering ambition with humility — learning to let others lead and accepting that followers have boundaries and needs of their own.
  adult_interpretation: As an adult man he is "The Preacher" — a charismatic leader who commands rooms and inspires movements; motivated by grand visions and expects his family to champion his cause without question.
  shadow: The reversed King of Wands becomes authoritarian and volatile — a Hitlerian figure who demands worship, silences critics, and can whip otherwise civilized people into a destructive mob through sheer force of will.

