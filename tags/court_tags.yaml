card_id: queen-of-pentacles
court_archetype:
  position: queen
  energy: Mastery of the material world through nurturing, practical wisdom, and hard work
  role: The Earth Mother or businesswoman who creates tangible success through determination
suit_domain:
  element: earth
  theme: Material world, work, finances, home, physical health, beauty
  zodiac_tendancy: Taurus, Virgo (earth signs grounded, value and quality oriented)
persona_tags:
  - Practical, down-to-earth, hands-on — builds birdhouses, tends gardens, reupholsters furniture
  - Owns and runs successful businesses, from home-baked cookies to multinational corporations
  - Scrupulous accounting and business sense, loves beautiful things and spares no expense
  - Enthusiastic outdoorswoman who encourages health and exercise in others
  - Expects her all from her family and children, wants the best for them, instills good values
  - May be controlling about appearances, community values, and how her children "should" be
  - Dismisses anything strange, unusual, or imaginative — excludes unique people and solutions
  - Her pragmatism is both her greatest strength and her blind spot
context_signals:
  development: Signifies making real a business, altering a work situation, or developing a health or exercise plan
  adult_interpretation: A practical woman who is an Earth Mother type or wealthy businesswoman; she keeps meticulous accounts and loves beautiful things; she expects high standards from everyone around her and may put unfair pressure on children or partners to conform to her values and community
  shadow: Reversed, she insists everything be the best and accepts nothing less from others; a demanding boss with no sympathy for those who can't keep up; thinks there is a practical solution to every problem — even when that's heartless; externally materials and plans go wrong; internally injury or physical limitation blocks her from doing the work she needs to do

