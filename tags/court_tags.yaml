card_id: queen-of-wands
court_archetype:
  position: queen
  energy: Commanding warmth and charisma, creative fire that draws others like moths to a flame
  role: The entertainer, activist, natural leader who lights up every room she enters
suit_domain:
  element: fire
  theme: Passion, creativity, leadership, charisma, energy, ambition
  zodiac_tendancy: Aries, Leo, Sagittarius (fire signs bold, radiant, action-oriented)
persona_tags:
  - Lights up a room, radiates warmth, humor, spirit, and energy
  - Often in entertainment, acting, music, or activism — a natural performer
  - Draws others to her with charisma, has all the connections and friends
  - Restless, hot, passionate, struggles to stay out of the spotlight
  - Creative with boundless energy to make, do, travel, and entertain
  - Can be bossy, overbearing, and intimidating when she doesn't get her way
  - May be too involved with her children's lives, a "soccer mom" type
  - Inspiration to family, friends, and even strangers — she gets things done and done well
context_signals:
  development: Signifies developing a trip, making real a career, or creating a movement
  adult_interpretation: A woman who lights up every room — often in entertainment or activism; charismatic and energetic, she draws others like moths to flame; she can be gentle with children but is prone to being bossy, overbearing, and intimidating; she may be too enmeshed in her children's lives; at her best she is an inspiration who gets things done
  shadow: Reversed, she is intimidating and controlling — you will do things her way or face her terrible temper; she will call in all her friends to snub and abandon you; a reversal signals loss of energy, loss of faith, social status drop, friends who won't or can't help; internally could signal chronic fatigue syndrome
