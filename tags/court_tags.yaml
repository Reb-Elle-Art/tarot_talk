card_id: king-of-pentacles
court_archetype:
  position: king
  energy: Material authority through disciplined hard work and conservative management
  role: The reliable provider and steward of physical resources and practical enterprises
suit_domain:
  element: earth
  theme: Material security, work, finances, and the physical foundations of life
  zodiac_tendancy: Taurus, Virgo, Capricorn (earth signs — practicality, patience, material ambition)
persona_tags:
  - Self-reliant and proud; earned his position through consistent hard work
  - Conservative manager who prefers proven methods over risky innovation
  - Practical and common-sensical; gets things done reliably and abundantly
  - Cold or aloof in speech but warm and generous with close relationships
  - Stubborn and resistant to change; "if it ain't broke, don't fix it"
  - Status-conscious; embarrassed by family members who stand out
  - Cheap in some areas, lavish in others; odd mix of miserliness and status spending
  - Values loyalty, discipline, and responsibility from those around him
context_signals:
  development: Growth toward mastery means learning flexibility — recognizing when old methods no longer serve and being willing to adapt without losing reliability.
  adult_interpretation: As an adult man he is "The Old Farmer" — a conservative businessman or manager whose kingdom is his enterprise; values hard work, community standing, and responsible provision for family above all.
  shadow: The reversed King of Pentacles becomes a stubborn miser who cheats workers, cuts corners, and resents paying fair wages; or conversely takes foolish risks and abandons his good sense because he cannot bend.

