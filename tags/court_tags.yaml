card_id: knight-of-pentacles
court_archetype:
  position: knight
  energy: Steady, plodding pursuit of practical goals through consistent effort and reliable planning
  role: The industrious worker who advances methodically toward material security
suit_domain:
  element: earth
  theme: Material security, work, finances, and the physical foundations of life
  zodiac_tendancy: Taurus, Virgo, Capricorn (earth signs — practicality, patience, material ambition)
persona_tags:
  - Highly responsible and conscientious; takes work, studies, and future planning seriously
  - Has long-term goals mapped out for career, family, finances — often down to marriage and children
  - Industrious to a fault; always has side projects, jobs, and extra-curricular activities
  - Comfortable with routine and order; has organizational systems for everything
  - Needs material signs of status but also desperately wants to fit in with peers
  - Relies on things rather than people for a sense of self-worth
  - Dislikes the unexpected; struggles to improvise or adapt when plans fail
  - Loyal employee and protector of beautiful things; keeps his word
context_signals:
  development: Growth means developing emotional flexibility — learning to improvise, handle surprises, and value relationships over plans and possessions.
  adult_interpretation: As a teen or teen-like person he is the organized over-achiever with a five-year plan; deeply concerned with having the right things and fitting in, maintaining strict routines and personal spaces.
  shadow: The reversed Knight of Pentacles becomes sloppy and resentful; appears to work while coasting, cheats and skims money, is bitter about others' success, brown-noses those above him, and refuses to help those without connections or wealth.

