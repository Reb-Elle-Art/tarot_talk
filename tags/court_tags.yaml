card_id: knight-of-cups
court_archetype:
  position: knight
  energy: Emotional pursuit — the romantic quester driven by feeling, imagination, and deep sensitivity
  role: The dreamy idealist who rides toward matters of the heart with passion and mood
suit_domain:
  element: water
  theme: Emotional depth, intuition, relationships, and the inner world of feeling
  zodiac_tendancy: Cancer, Scorpio, Pisces (water signs — deep feeling, loyalty, hidden depths)
persona_tags:
  - The romantic knight who falls deeply and sincerely; love is spiritual and all-consuming
  - Dreamy, moody, and introspective; spends hours lost in music, poetry, art
  - Highly sensitive and feels everything intensely; emotionally authentic
  - Convinced no one else understands the depth of their experience
  - Fiercely loyal once committed to a person or cause
  - Prone to melancholy and depression; can be at risk when feelings overwhelm
  - Experiments with substances or risky behavior to escape overwhelming emotion
  - Idealistic and believes in the purity of true love and artistic calling
context_signals:
  development: Growth means learning to distinguish between genuine depth and emotional indulgence — grounding intense feelings in reality without losing the capacity for intimacy.
  adult_interpretation: As a teen or teen-like person he is the "emo knight" — profoundly romantic and moody, deeply convinced of the uniqueness of his own feelings, often withdrawing to process emotions alone.
  shadow: The reversed Knight of Cups sinks into dark depression and cynicism; uses emotional insight to wound others, becomes bitter and manipulative, or swings to hyper-sensitivity where every small thing is an overwhelming insult.

