court_archetype:
  position: knight
  energy: Intellectual charge — rapid, aggressive pursuit of truth, debate, and mental victory
  role: The sharp-witted challenger who rides into intellectual battle with speed and precision
suit_domain:
  element: air
  theme: Intellect, truth, communication, conflict resolution, and the life of the mind
  zodiac_tendancy: Gemini, Libra, Aquarius (air signs — mental agility, objectivity, ideals)
persona_tags:
  - Brilliant and quick-thinking; wins arguments with speed and clever rhetoric
  - Loves to debate and question; challenges teachers, bosses, and authority figures
  - Can be arrogant and condescending toward those he perceives as less intelligent
  - Spreads gossip and stirs conflict for the thrill of seeing what unfolds
  - Uncaring about the emotional consequences of his words
  - Capable of serious trouble — hacking, trolling, verbal cruelty
  - Excellent ally in battle; fights hardest for freedom of information and speech
  - Restless, quick to change direction, always seeking the next mental challenge
context_signals:
  development: Growth means developing emotional intelligence alongside intellectual ability — learning that not every problem needs to be won, and that empathy is not weakness.
  adult_interpretation: As a teen or teen-like person he is the sharp-tongued intellect who questions everything; too smart for his own good and too quick with words to be argued with, making him cold and sometimes cruel.
  shadow: The reversed Knight of Swords becomes a braggart and coward who hides behind big words; a cheat who takes credit for others' work, a hacker who uses his skills destructively, unable to express himself effectively and frustrated by his own limitations.

