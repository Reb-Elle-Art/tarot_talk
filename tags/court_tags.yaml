card_id: king-of-swords
court_archetype:
  position: king
  energy: Intellectual authority wielded with precision, fairness, and unwavering principle
  role: The objective arbiter who rules through clarity of thought and high ideals
suit_domain:
  element: air
  theme: Intellect, truth, communication, conflict resolution, and the life of the mind
  zodiac_tendancy: Gemini, Libra, Aquarius (air signs — mental agility, objectivity, ideals)
persona_tags:
  - Brilliant and analytical; sees multiple moves ahead like a master chess player
  - Deeply principled and consistent; judged by how fairly he treats everyone
  - Objective even to a fault; will not bend rules for family
  - Emotionally distant and perceived as cold; struggles to connect on a feeling level
  - Patient and measured communicator who engages others in debate and research
  - Uncompromising on ideals; unforgiving of weakness or moral failure
  - Others may not fully understand his reasoning but trust his integrity
  - Sought out for the hardest, most far-reaching decisions
context_signals:
  development: Growth toward mastery means integrating compassion with objectivity — learning that fairness sometimes requires understanding context, not just applying principles uniformly.
  adult_interpretation: As an adult man he is "The Judge" — driven by ideals and fairness rather than family loyalty; expects high standards from those around him and will not show favoritism even to loved ones.
  shadow: The reversed King of Swords becomes a cruel intellectual who uses his brilliance to destroy opponents; may censor, manipulate evidence, or suppress inconvenient truths to maintain power and silence criticism.

