court_archetype:
  position: page
  energy: Industrious, practical newcomer driven by material ambition and self-improvement
  role: The hard-working apprentice who measures success in tangible results and honest labor
suit_domain:
  element: earth
  theme: Material world, work, finances, home, physical health
  zodiac_tendancy: Taurus, Virgo (earth signs grounded and value-oriented)
persona_tags:
  - Hands-on and practical, enjoys building, fixing, cooking, repairing
  - Very frugal and financially cautious, counts money often, always aware of its worth
  - Health-conscious and competitive only with themselves, focused on self-improvement
  - Industrious taker-on of chores and work, willing to go above and beyond for pay
