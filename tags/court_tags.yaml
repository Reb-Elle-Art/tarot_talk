card_id: queen-of-swords
court_archetype:
  position: queen
  energy: Mastered intellect and communication, a sharp mind wielding words as tools of power
  role: The strategist, problem-solver, walking encyclopedia — or the cold and cutting authority figure
suit_domain:
  element: air
  theme: Intellect, truth, clarity, communication, strategy, analysis
  zodiac_tendancy: Aquarius, Libra, sometimes Gemini (air signs logical and communicative)
persona_tags:
  - Walking encyclopedia, can talk science with scientists and poetry with poets
  - Far-sighted, ahead of the game on new developments and unconventional ideas
  - Works in communications, psychology, politics, research, law, medicine, radio
  - Cool demeanor, very "queen-like," intellectually intimidating and magnetic
  - Uses words to persuade gently or to tear arguments and people to pieces
  - Parents with facts and logic, not hugs — intellectually stimulating but emotionally distant
  - Wants to know everything, may listen in or read others' private communications
  - Means well but her need to solve problems outweighs her consideration of feelings
context_signals:
  development: Signifies developing a speech, scientific theory, dissertation, debate, or spreading news and ideas
  adult_interpretation: A woman who is a consummate problem-solver — a scientist, doctor, lawyer, psychologist, or researcher; she can talk with anyone about anything; she parents with facts not comfort; she is ahead of her time but can be eccentric; she is fascinated and magnetic but cold
  shadow: Reversed, she is aloof, distant, cold, and cruel; she uses information without compassion, wins arguments through harsh facts with no tact; her mental acuity and communication are blocked — computers and phones break down, arguments spiral into miscommunication; internally could indicate memory loss or stroke

