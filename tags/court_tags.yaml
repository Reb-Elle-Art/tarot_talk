card_id: king-of-cups
court_archetype:
  position: king
  energy: Mastery of emotion through wisdom and self-control; paternal authority powered by deep feeling
  role: The emotionally mature father figure who rules his kingdom with compassion and fair judgment
suit_domain:
  element: water
  theme: Emotional depth, intuition, relationships, and the inner world of feeling
  zodiac_tendancy: Cancer, Scorpio, Pisces (water signs — deep feeling, loyalty, hidden depths)
persona_tags:
  - The nurturing patriarch who leads through love, loyalty, and fierce family devotion
  - Emotionally intelligent and self-aware; has mastered his own feelings
  - Fair and empathetic judge who can see all sides of a conflict
  - Sentimental to a fault; will forgive almost anything for family
  - Uses emotional manipulation to keep loved ones close
  - Tendency toward moodiness, depression, or escapism (alcohol)
  - Expects emotional maturity and civility from those around him
  - The neighborhood "Dad" — surrogate father figure everyone turns to
context_signals:
  development: Growth toward emotional mastery means learning to balance compassion with boundaries — knowing when to support and when to let people face consequences.
  adult_interpretation: As an adult man he is "The Godfather" — a loving paternal figure whose kingdom is his family, willing to make any sacrifice for them and motivated by deep loyalty and emotional investment in others' wellbeing.
  shadow: The reversed King of Cups becomes partisan and maudlin, forgiving family faults while condemning outsiders; uses love and loyalty to enable secrets, suppress truth, or manipulate — potentially toxic emotional enmeshment.

